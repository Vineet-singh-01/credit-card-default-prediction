name: Build and publish credit-risk model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the official UCI workbook
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            "https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip" \
            --output /tmp/uci-credit-default.zip
          unzip -o /tmp/uci-credit-default.zip -d /tmp/uci-credit-default
          cp "/tmp/uci-credit-default/default of credit card clients.xls" "data/default of credit card clients.xls"

      - name: Prepare data and train model
        run: |
          python src/prepare_data.py
          python src/train_model.py

      - name: Publish model artifact and updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/credit_default_pipeline.joblib
          git add models/model_metadata.json reports/final_test_metrics.json reports/validation_model_comparison.json reports/dataset_audit.json
          git commit -m "Build reproducible credit-risk model artifact" || echo "No artifact changes to commit"
          git push origin HEAD:main
