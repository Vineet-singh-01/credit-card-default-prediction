name: React and FastAPI application checks

on:
  push:
    branches: [feature/react-frontend-fastapi]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "models/**"
      - "reports/**"
      - ".github/workflows/react-app-check.yml"

permissions:
  contents: read

jobs:
  backend-and-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run unit, API and real-model integration tests
        run: python -m pytest -q
      - name: Confirm legacy Streamlit app and model artifact remain present
        run: |
          test -f app.py
          test -f models/credit_default_pipeline.joblib
          test -f models/model_metadata.json

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
