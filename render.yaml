services:
  # FastAPI service: loads the existing saved model from the repository.
  - type: web
    name: creditrisk-analytics-api-vineet
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://creditrisk-analytics-vineet.onrender.com

  # Static Vite/React frontend. VITE_API_URL is injected at build time.
  - type: web
    name: creditrisk-analytics-vineet
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://creditrisk-analytics-api-vineet.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
